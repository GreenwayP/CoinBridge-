<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Markets | CoinBridge</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #050b14;
      color: #ffffff;
      min-height: 100vh;
    }

    button,
    input {
      font-family: inherit;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    /* SIDEBAR */

    .sidebar {
      width: 245px;
      background: #07111d;
      border-right: 1px solid #1b3042;
      padding: 25px 16px;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 100;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      padding: 0 12px;
      margin-bottom: 40px;
    }

    .logo span {
      color: #22d3ee;
    }

    .menu-title {
      color: #617488;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 0 12px;
      margin-bottom: 10px;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .nav a {
      color: #91a1b4;
      padding: 12px;
      border-radius: 9px;
      font-size: 14px;
    }

    .nav a:hover,
    .nav a.active {
      background: rgba(34, 211, 238, 0.09);
      color: #22d3ee;
    }

    .logout {
      position: absolute;
      bottom: 25px;
      left: 16px;
      right: 16px;
    }

    .logout a {
      display: block;
      padding: 12px;
      color: #8798ab;
      font-size: 14px;
      border-radius: 9px;
    }

    .logout a:hover {
      background: rgba(255,255,255,0.04);
      color: #ffffff;
    }

    /* MAIN */

    .main {
      margin-left: 245px;
      width: calc(100% - 245px);
      padding: 28px;
    }

    .mobile-header {
      display: none;
    }

    .mobile-menu {
      display: none;
    }

    /* TOPBAR */

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      gap: 20px;
    }

    .welcome h1 {
      font-size: 28px;
      margin-bottom: 6px;
    }

    .welcome p {
      color: #718096;
      font-size: 13px;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #153247;
      display: grid;
      place-items: center;
      color: #22d3ee;
      font-weight: 800;
    }

    .profile-name {
      font-size: 13px;
      font-weight: bold;
    }

    .profile-status {
      color: #34d399;
      font-size: 11px;
      margin-top: 3px;
    }

    /* MARKET HEADER */

    .market-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .search-box {
      position: relative;
      width: 280px;
    }

    .search-box input {
      width: 100%;
      background: #091522;
      border: 1px solid #1d3448;
      color: #ffffff;
      border-radius: 9px;
      padding: 12px 14px 12px 38px;
      outline: none;
    }

    .search-box input:focus {
      border-color: #22d3ee;
    }

    .search-icon {
      position: absolute;
      left: 13px;
      top: 11px;
      color: #718096;
    }

    .market-status {
      color: #718096;
      font-size: 11px;
    }

    .market-status span {
      color: #34d399;
    }

    /* MARKET CARDS */

    .market-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }

    .market-card {
      background: #091522;
      border: 1px solid #1d3448;
      border-radius: 14px;
      padding: 18px;
      cursor: pointer;
      transition: 0.2s;
    }

    .market-card:hover,
    .market-card.selected {
      border-color: #22d3ee;
      transform: translateY(-1px);
    }

    .market-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .coin-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .coin-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #132b3d;
      display: grid;
      place-items: center;
      color: #22d3ee;
      font-weight: bold;
    }

    .coin-name {
      font-size: 12px;
      font-weight: bold;
    }

    .coin-symbol {
      color: #718096;
      font-size: 10px;
      margin-top: 3px;
    }

    .watch-button {
      border: none;
      background: transparent;
      color: #617488;
      font-size: 19px;
      cursor: pointer;
    }

    .watch-button.active {
      color: #facc15;
    }

    .market-price {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .market-change {
      font-size: 11px;
    }

    .positive {
      color: #34d399;
    }

    .negative {
      color: #fb7185;
    }

    /* CHART PANEL */

    .chart-panel {
      background: #091522;
      border: 1px solid #1d3448;
      border-radius: 15px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .chart-header {
      padding: 20px;
      border-bottom: 1px solid #1b3042;
    }

    .chart-title-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
      margin-bottom: 18px;
    }

    .selected-coin {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .selected-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #132b3d;
      display: grid;
      place-items: center;
      color: #22d3ee;
      font-size: 20px;
      font-weight: bold;
    }

    .selected-name {
      font-size: 17px;
      font-weight: bold;
    }

    .selected-symbol {
      color: #718096;
      font-size: 10px;
      margin-top: 4px;
    }

    .selected-price {
      font-size: 24px;
      font-weight: 800;
      text-align: right;
    }

    .selected-change {
      font-size: 11px;
      text-align: right;
      margin-top: 4px;
    }

    .timeframes {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .timeframe {
      border: 1px solid #1d3448;
      background: #07111d;
      color: #718096;
      border-radius: 6px;
      padding: 7px 11px;
      cursor: pointer;
      font-size: 10px;
    }

    .timeframe:hover,
    .timeframe.active {
      color: #22d3ee;
