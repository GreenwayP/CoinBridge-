<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account | CoinBridge</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #050b14;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 18px;
    }

    .container {
      width: 100%;
      max-width: 470px;
    }

    .logo {
      text-align: center;
      font-size: 27px;
      font-weight: 800;
      margin-bottom: 28px;
    }

    .logo span {
      color: #22d3ee;
    }

    .card {
      background: #091522;
      border: 1px solid #20394d;
      border-radius: 18px;
      padding: 35px;
      box-shadow: 0 25px 70px rgba(0,0,0,0.4);
    }

    .card h1 {
      font-size: 29px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #8798ab;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #d8e0e8;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      background: #07111d;
      border: 1px solid #294052;
      border-radius: 8px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #22d3ee;
    }

    .terms {
      display: flex;
      gap: 9px;
      align-items: flex-start;
      margin: 20px 0;
      color: #8798ab;
      font-size: 12px;
    }

    .terms input {
      width: auto;
      margin-top: 3px;
    }

    .terms a {
      color: #22d3ee;
    }

    button {
      width: 100%;
      border: none;
      padding: 14px;
      border-radius: 9px;
      background: #22d3ee;
      color: #041018;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .login {
      text-align: center;
      color: #8798ab;
      font-size: 14px;
      margin-top: 23px;
    }

    .login a {
      color: #22d3ee;
      font-weight: bold;
    }

    .notice {
      margin-top: 22px;
      padding: 12px;
      background: rgba(34,211,238,0.06);
      border: 1px solid rgba(34,211,238,0.15);
      border-radius: 8px;
      color: #8da0b3;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 480px) {
      .card {
        padding: 25px 20px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      Coin<span>Bridge</span>
    </div>

    <div class="card">

      <h1>Create your account</h1>

      <p class="subtitle">
        Join CoinBridge and start your digital asset journey.
      </p>


      <form>

        <div class="form-group">
          <label for="fullname">Full Name</label>

          <input
            type="text"
            id="fullname"
            name="fullname"
            placeholder="Enter your full name"
            autocomplete="name"
            required
          >
        </div>


        <div class="form-group">
          <label for="email">Email Address</label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email address"
            autocomplete="email"
            required
          >
        </div>


        <div class="form-group">
          <label for="password">Password</label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a strong password"
            autocomplete="new-password"
            required
          >
        </div>


        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>

          <input
            type="password"
            id="confirm-password"
            name="confirm-password"
            placeholder="Confirm your password"
            autocomplete="new-password"
            required
          >
        </div>


        <label class="terms">

          <input type="checkbox" required>

          <span>
            I agree to the CoinBridge
            <a href="#">Terms of Service</a>
            and
            <a href="#">Privacy Policy</a>.
          </span>

        </label>


        <button type="submit">
          Create Account
        </button>

      </form>


      <div class="login">
        Already have an account?
        <a href="login.html">Log in</a>
      </div>


      <div class="notice">
        Account creation is currently a front-end demo.
        Secure authentication will be connected later.
      </div>

    </div>

  </div>

</body>
</html>
